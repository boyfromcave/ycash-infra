# COOP/COEP make SharedArrayBuffer available (wasm threads for proving in a worker) and OPFS
# sync access handles work; the CSP pins the only network destination to this origin (the
# gateway serves both the bundle and the gRPC-web API, so connect-src 'self' is enough).
server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  location / { try_files $uri /index.html; }
  location ~* \.(wasm)$ { types { application/wasm wasm; } add_header Cache-Control "public, max-age=31536000, immutable"; }
}
