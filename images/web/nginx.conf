# COOP/COEP make SharedArrayBuffer available (wasm threads for proving in a worker) and OPFS
# sync access handles work; the CSP pins the network destinations to this origin (the gateway
# serves both the bundle and the gRPC-web API, so connect-src 'self' covers the wallet) plus
# download.z.cash (the app's proving-file source, kept for a mirror typed in Settings; the browser's
# default is this origin's /sapling-params/, below, as download.z.cash sends no CORS header) and
# $CSP_CONNECT_SRC_EXTRA (dev only). A dedicated worker takes the CSP of its own script's
# response, so these headers go on every response — `expires` rather than a second add_header
# in the .wasm location, which would drop the inherited ones (nginx add_header semantics).
# Mirrors yew/web/index.html's <meta> policy, which the document applies on its own.
# The proving files under /sapling-params/ (Dockerfile): one year and `immutable` (their content is
# pinned by SHA-256 and never changes), as application/octet-stream; a missing file is a 404, never
# the index.html fallback (an HTML page in place of the file is refused by the wallet's pins, but a
# 404 reads as what it is). The header comes from a map so the location keeps the server's headers
# (a location with its own add_header drops the inherited ones).
map $uri $sapling_params_cache {
  ~^/sapling-params/ "public, max-age=31536000, immutable";
  default "";
}
server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://download.z.cash ${CSP_CONNECT_SRC_EXTRA}; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control $sapling_params_cache always;
  location / { try_files $uri /index.html; }
  # Vite's hashed asset names are immutable; index.html (no hash) is revalidated.
  location /assets/ { expires 1y; }
  location /sapling-params/ { types { } default_type application/octet-stream; try_files $uri =404; }
  location = /index.html { expires -1; }
}
