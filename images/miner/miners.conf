# The miners the entrypoint may download at container start, with their pinned SHA-256 (public values).
# Read by entrypoint.sh as KEY=value lines (no shell is run). The image never contains a miner binary.
#
# lolMiner (the default): the official GitHub release asset. SHA-256 computed on download, 2026-11-01;
# confirm it against the digest GitHub shows next to the asset on
# https://github.com/Lolliedieb/lolMiner-releases/releases/tag/1.98a before the first live run.
LOLMINER_VERSION=1.98a
LOLMINER_URL=https://github.com/Lolliedieb/lolMiner-releases/releases/download/1.98a/lolMiner_v1.98a_Lin64.tar.gz
LOLMINER_SHA256=0b8078299654a12846e4967f1db3506409cfb8b1031687a910965d1a99c6f270
#
# miniZ (optional, off): not pinned. miniz.cc could not be reached when this was written and its Terms
# are unreviewed. MINER=miniz is refused until MINIZ_URL (https, the official download) and
# MINIZ_SHA256 are set, here or in the container's environment (the fleet file's miniz_url /
# miniz_sha256), after the owner has read miniZ's Terms and confirmed its 192,7 personalization flags.
MINIZ_URL=
MINIZ_SHA256=
