# External Secrets reads AWS Secrets Manager with its own IRSA role (the operator's ServiceAccount
# is annotated by addons.tf), so no credentials are referenced here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
