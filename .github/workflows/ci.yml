name: ci
on: { push: { branches: [upgrade/vault, main] }, pull_request: {} }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: helm lint charts/ycash-lightwallet -f charts/ycash-lightwallet/values-kind.yaml
      - run: helm lint charts/ycash-lightwallet -f charts/ycash-lightwallet/values-eks.yaml --set ycashd.rpc.password=x
      - run: helm template t charts/ycash-lightwallet -f charts/ycash-lightwallet/values-kind.yaml | kubeconform -strict -ignore-missing-schemas -summary
      - run: cd yindex && go vet ./... && go test ./... && go build ./...
  yindex-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f images/yindex/Dockerfile -t yindex:ci .
