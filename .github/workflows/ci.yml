name: ci
on: { push: { branches: [upgrade/vault, main, vaults/kogany-compat] }, pull_request: {} }
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          # no Go cache, as codeql.yml and secops.yml: a pull_request run must not save one
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: helm lint charts/ycash-lightwallet -f charts/ycash-lightwallet/values-kind.yaml
      # every rendered image pinned by a non-latest tag or a digest (audit 06/I-1)
      - run: scripts/lint-images.sh
      - run: helm template t charts/ycash-lightwallet -f charts/ycash-lightwallet/values-kind.yaml | kubeconform -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      # the testnet renders (render-only until N1): charts/ycash-testnet kind + EKS values and the
      # lightwallet chart's values-testnet.yaml, helm lint + kubeconform (placeholder release digests)
      - run: make lint-testnet
      # the kogany backend (nodeLine kogany, workspace kogany plan W9-c), render-only: helm lint,
      # kubeconform, scripts/tests/test-kogany-render.sh
      - run: make lint-kogany
      # the testnet chart's scripts (run.sh, ready.sh, live.sh, prefix-restore.sh, zcash-params.sh, snapshot.sh) are POSIX sh
      - run: shellcheck -s sh charts/ycash-testnet/files/*.sh
      # the Zcash parameter mirror: SHA256SUMS = the chart's copy, the chart's init script (zcash-params.sh)
      - run: make zcash-params-test
      # the testnet services, offline: the faucet (both modes), the probe and status page, the state
      # bundle (the snapshotter's steps against a stand-in node, verify.py)
      - run: make services-test
      - run: cd yindex && go vet ./... && go test ./... && go build ./...
  eks:
    # offline: terraform fmt/validate for infra/eks (the example root and the module), the module's terraform test
    # (mocked providers), the chart's EKS values through kubeconform with the CRD schemas; infra/testnet-seeds (ips,
    # nodes): fmt/validate, terraform test, shellcheck, the seedctl test; infra/mainnet-harvest: the same, and the boot
    # script's offline test. No AWS credentials, no plan: deploys run elsewhere.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.9.8" }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          # no Go cache, as codeql.yml and secops.yml: a pull_request run must not save one
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: make eks-validate
      - run: make seeds-validate
      - run: make harvest-validate
  yindex-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: docker build -f images/yindex/Dockerfile -t yindex:ci .
  miner:
    # the testnet GPU miner (images/miner, scripts/vast-fleet.py): the entrypoint against a stand-in
    # lolMiner, the fleet script against a stand-in Vast API (nothing rented), the example fleet file;
    # then the image is built (it holds no miner binary), its entrypoint run in dry-run mode (no
    # download) and in diagnostic mode (lolMiner downloaded and listing devices; nothing mined: no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: make miners-test
      - run: docker build -t ycash-miner:ci images/miner
      - run: docker run --rm -e POOL_URL=pool.example:3333 -e WORKER=ci -e MINER_DRY_RUN=1 ycash-miner:ci
      # MINER_DIAG: the real lolMiner (downloaded, SHA-256 checked) lists its devices inside the image. With
      # no GPU it must find the OpenCL loader (GPU burst 1: "No OpenCL driver or GPUs detected." in the
      # first image) and the entrypoint must refuse to mine with exit 70
      - name: no GPU - the device checks run and the entrypoint exits 70
        run: |
          rc=0
          docker run --rm -e POOL_URL=pool.example:3333 -e WORKER=ci -e MINER_DIAG=1 ycash-miner:ci > diag.txt 2>&1 || rc=$?
          cat diag.txt
          [ "$rc" = 70 ] || { echo "::error::expected exit 70 without a GPU, got $rc"; exit 1; }
          grep -q 'lolMiner --list-devices: OpenCL driver detected' diag.txt || { echo "::error::lolMiner does not see the OpenCL loader"; exit 1; }
          grep -q 'cl-probe: no OpenCL platform' diag.txt || { echo "::error::cl-probe did not run"; exit 1; }
      # miniZ from miniz.cc's own link (a query URL), its SHA-256 and the checksum file inside its archive
      # checked; without a GPU it cannot load libcuda.so.1 and the entrypoint exits 70 (the values the
      # ycash-ops fleet file pins: images/miner/README.md "miniZ")
      - name: no GPU - miniZ is fetched, checked, lists its devices, and the entrypoint exits 70
        env:
          MINIZ_URL: https://miniz.cc/?sdm_process_download=1&download_id=5200
          MINIZ_SHA256: 873f011442df76b9aae541f3c1a385677f5ea75d94a41da08647a7e51f92ae30
        run: |
          rc=0
          docker run --rm -e POOL_URL=pool.example:3333 -e WORKER=ci -e MINER=miniz -e MINIZ_URL -e MINIZ_SHA256 \
            -e MINER_DIAG=1 ycash-miner:ci > diagz.txt 2>&1 || rc=$?
          cat diagz.txt
          [ "$rc" = 70 ] || { echo "::error::expected exit 70 without a GPU, got $rc"; exit 1; }
          grep -q 'miniz verified' diagz.txt || { echo "::error::miniZ was not downloaded and checked"; exit 1; }
          grep -q 'miniZ --cuda-info: ' diagz.txt || { echo "::error::miniZ did not list its devices"; exit 1; }
