name: codeql

# CodeQL static analysis (SECURITY-CI.md). The same shape in every Yellowback repo; the language list is
# what this repository holds:
#
#   go                     yindex (the address index), built by hand (`go build ./...` in yindex/):
#                          CodeQL's Go extractor needs a build.
#   python                 the regtest faucet (images/faucet) and scripts/kind-personas.py; build-mode none.
#   javascript-typescript  the faucet page's script (images/faucet/app.js); build-mode none.
#   actions                the workflows under .github/workflows; build-mode none.
#
# queries: security-extended. Results go to GitHub code scanning (one category per language); a run never
# fails on an alert, so pre-existing alerts never block a PR: code scanning shows the PR's new alerts on
# the PR itself. pull_request + push to upgrade/vault + weekly (Mondays 04:41 UTC).
on:
  push:
    branches: ['upgrade/vault']
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # A fork's PR token cannot upload to code scanning; the push / schedule runs cover forks' code once merged.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read   # the actions language reads workflow metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: manual }
          - { language: python, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: ${{ matrix.language == 'go' }}
        with:
          go-version: '1.26'
          check-latest: true
          cache: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              # Generated protobuf/gRPC code copied from lightwalletd-dd (the same as .semgrepignore).
              - yindex/walletrpc/*.pb.go
      - name: Build yindex
        if: ${{ matrix.build-mode == 'manual' }}
        working-directory: yindex
        run: go build ./...
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: codeql-${{ matrix.language }}
