reason = "python-ecdsa Minerva timing attack (CVE-2024-23342, no fixed release). In contrib/secops/checkov-requirements.txt only: checkov is a CI scanner that never signs, generates keys or does ECDH with ecdsa; signature verification is unaffected. Nothing that ships uses it."

