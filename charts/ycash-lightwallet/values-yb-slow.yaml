# The light-wallet endpoint of testnet-yb-slow (workspace docs/plans/yellowback-testnet-plan.md, Revision
# 3, T-20): one release per network, each in its own namespace on the one testnet cluster, layered
# over values-eks.yaml and values-testnet.yaml:
#
#   helm upgrade --install lite charts/ycash-lightwallet -n yb-slow --create-namespace \
#     -f charts/ycash-lightwallet/values-eks.yaml -f charts/ycash-lightwallet/values-testnet.yaml \
#     -f charts/ycash-lightwallet/values-yb-slow.yaml --set images.ycashd.digest=sha256:… …
#
# In plain words: the same light-wallet backend, pointed at one of the three practice networks.
# What differs between them is the profile, its ports, the public host name and the secrets.
#
# The profile goes into ycash.conf (testnetprofile=slow beside testnet=1), so the node and every
# ycash-cli call in the probes pick the same network. The seeds' addresses (infra/testnet-seeds,
# port 18933) are added at deploy as addnode= lines (ycashd.confExtra). The host is a placeholder: the
# real one is the operator's, under the domain the cluster's external-dns may write (infra/eks/module
# var.domain).
ycashd:
  rpc: { port: 18932 }
  p2p: { port: 18933 }
  extraArgs: "-dnsseed=0"
  confExtra: "testnetprofile=slow"
gateway:
  host: lite-slow.example.org
lightwalletd:
  yellowback: true
# Yellowback is on here: lightwalletd-dd proxies YellowbackStreamer. The YED personas and this
# network's attestor set (T-19) are not a chart workload yet (plan §6.2 `attestor`, K7). Its set
# (T-5): 3 house seats at launch, 4 invited operators later; the seat keys live in the cluster's secret store, never in a repository.
externalSecrets:
  ycashdRpc: ycash/testnet/yb-slow/ycashd-rpc             # infra/eks/module, networks = [..., "yb-slow"]
  yindexPostgres: ycash/testnet/yb-slow/yindex-postgres   # {url} to this network's database, yindex_yb_slow
