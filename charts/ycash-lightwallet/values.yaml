# Defaults. values-kind.yaml and values-eks.yaml override; a template never branches on "which
# cloud", only on these values (AGENTS.md rule 2).
nameOverride: ""

images:
  ycashd:       { repository: ycash/ycashd,       tag: local, pullPolicy: IfNotPresent }
  lightwalletd: { repository: ycash/lightwalletd, tag: local, pullPolicy: IfNotPresent }
  yindex:       { repository: ycash/yindex,       tag: local, pullPolicy: IfNotPresent }
  web:          { repository: ycash/web,          tag: local, pullPolicy: IfNotPresent }
  redis:        { repository: redis,              tag: 7.4-alpine, pullPolicy: IfNotPresent }
  postgres:     { repository: postgres,           tag: 17-alpine, pullPolicy: IfNotPresent }
  # kind only (regtest.armYellowback): kubectl + curl + jq for the arming Job. Pinned by digest (audit 06/I-1):
  # kubectl v1.37.1, matching the kind node image's Kubernetes v1.37.0 (kind v0.33.0), pinned 2026-10-12.
  # Bitnami publishes only `latest` for this image now (no 1.37.1 / 1.37 tag on Docker Hub), so the tag is
  # empty and the multi-arch index digest (linux/amd64 + linux/arm64) is the reference. Bump procedure:
  # docs/plans/ycash-infra-plan.md "Pinned third-party images".
  kubectl:      { repository: bitnami/kubectl,    tag: "", digest: "sha256:999d5eb28f404b45f15117f2a110ff23c6164f76edac261d75d783b6e88252b7", pullPolicy: IfNotPresent }
  # kind only (regtest.faucet): images/faucet, `make image-faucet`
  faucet:       { repository: ycash/faucet,       tag: local, pullPolicy: IfNotPresent }

# ---- the node pool ---------------------------------------------------------------------------
ycashd:
  replicas: 2
  network: mainnet            # mainnet | testnet | regtest
  # The node line the image must be built from: the arming Job refuses a node whose
  # yed_getinfo.rpcversion differs (8 = the post-quantum line, upgrade/quantum-vaults: PQ vault owners,
  # TX_PQPKH holders, sq…/yb… addresses, the fee structure; 6 = upgrade/vault in-term). lightwalletd-dd
  # checks the same number exactly (common.KnownRPCVersion), so build both images from the same line
  # (`make line` prints the trees' rpcversion). 0 = no check.
  rpcVersion: 8
  extraArgs: ""               # appended verbatim. Regtest: the Vault -nuparams with Overwinter..Canopy at or below it, never Vault alone (ycashd refuses to start without Sapling active at or below Vault, quantum spec R-A3), e.g. values-kind.yaml's "-nuparams=5ba81b19:1 -nuparams=76b809bb:1 -nuparams=374d694f:1 -nuparams=8e471bd6:1 -nuparams=66314da3:1 -nuparams=19bd2d2f:1 -nuparams=6d5b7a31:1"; the attestor set comes from the arming Job
  confExtra: ""               # extra ycash.conf lines
  rpc:
    port: 8832                # 18832 for testnet/regtest
    threads: 16
    workqueue: 64
    # Either inline (kind only) or an existing Secret with keys rpcuser/rpcpassword (EKS: External Secrets).
    existingSecret: ""
    user: ycash
    # password: no default. Set ycashd.rpc.password (kind: values-kind.yaml's regtest credential) or
    # existingSecret; templates/ycashd/secret.yaml fails the render with neither.
  p2p:
    listen: true
    port: 8833
  storage:
    className: ""             # "" = cluster default (kind: standard / local-path)
    size: 20Gi
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { memory: 6Gi }
  # readiness: synced (verificationprogress > 0.9999) and within readinessLagBlocks of the best known tip
  readinessLagBlocks: 1
  podDisruptionBudget: { enabled: true, minAvailable: 1 }

# ---- lightwalletd-dd -------------------------------------------------------------------------
lightwalletd:
  replicas: 2
  yellowback: true
  maxInflight: 16             # --yellowback-max-inflight: yed_* node calls in flight per replica
  logLevel: 4
  extraArgs: ""
  cache: { medium: "", sizeLimit: 2Gi }   # emptyDir per replica; medium "Memory" keeps it in RAM
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 2Gi }
  autoscaling: { enabled: false, min: 2, max: 50, cpuUtilization: 60 }
  podDisruptionBudget: { enabled: true, minAvailable: 1 }
  trustedProxyCidrs: "10.0.0.0/8"

# ---- yindex: the address index (plan K3) -----------------------------------------------------
yindex:
  enabled: true
  replicas: 2
  # which CompactTxStreamer methods the gateway routes here instead of lightwalletd; drop one
  # from the list to fall back to lightwalletd's node-proxied implementation for that method.
  routes: [GetAddressUtxos, GetAddressUtxosStream, GetTaddressTxids, GetTaddressBalance, GetTaddressBalanceStream]
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { memory: 1Gi }
  postgres:
    enabled: true             # in-cluster StatefulSet; false = externalUrl (RDS on EKS)
    externalUrl: ""
    storage: { className: "", size: 20Gi }
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }

# ---- Redis: tip-hash-keyed cache of yed_* reads (plan K3) ------------------------------------
redis:
  enabled: true
  maxmemory: 512mb
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }

# ---- the web wallet bundle (yew/web) ---------------------------------------------------------
web:
  enabled: false
  replicas: 2
  # Environment of the nginx container (images/web): CSP_CONNECT_SRC_EXTRA widens the CSP's
  # connect-src (dev only; see values-kind.yaml).
  env: {}

# ---- Envoy Gateway ----------------------------------------------------------------------------
gateway:
  enabled: true
  className: eg
  createClass: true           # the Envoy Gateway helm chart installs the controller, not a GatewayClass
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  host: lite.example.org
  tls:
    mode: certmanager         # certmanager | existing | none
    issuer: ""                # ClusterIssuer name (certmanager mode); "" on kind = a self-signed one this chart creates
    secretName: ""            # existing mode
  plaintextGrpc: true         # a second listener on 9067 without TLS (kind/ghz); off on EKS
  plaintextGrpcCors: false    # CORS (any origin) on that listener, for a browser wallet served elsewhere (kind only)
  service:
    type: LoadBalancer        # kind: NodePort with the ports kind/kind.yaml maps
    nodePorts: { https: 30443, grpc: 30067 }
    annotations: {}
    externalDns: false        # annotate the Envoy Service with external-dns.alpha.kubernetes.io/hostname: <gateway.host>
  rateLimit:
    enabled: true
    perIpPerSecond: 50
    sendPerIpPerMinute: 30
  # false: the gateway drops a client-supplied x-real-ip / x-forwarded-for before Envoy writes
  # its own from the connection (plan §5 A-3), so lightwalletd-dd's --trusted-proxy-cidr limiter
  # keys on the real peer. true only when another proxy that sets them stands in front of the
  # gateway (an L7 load balancer / CDN) — an NLB does not.
  trustForwardedHeaders: false

# ---- kind-only: the chain itself -------------------------------------------------------------
regtest:
  enabled: false              # bootstrap Job (mine past maturity) + miner Deployment + RPC NodePort
  activationHeight: 1
  bootstrapBlocks: 200
  minerIntervalSeconds: 5
  rpcNodePort: 30832
  # Arm YED (the devnet `up` recipe as a Job, templates/kind/arm.yaml): create the YED attestor set
  # on chain, restart the node with -yellowbackattestorset=<setid>, roll lightwalletd. The set id
  # lands in ConfigMap <release>-yellowback-set (with a payout address of the node's wallet: the
  # StatefulSet renders -yellowbackpayoutaddress from it, K0c, so the node is the quoting pool), one
  # attestor key in Secret <release>-yellowback-attestor. Attestors, quotes and prices: `make
  # kind-personas-up` (scripts/kind-personas.py, host-run).
  armYellowback: false
  attestorSet:                # the regtest YED constants (ycash6/src/yellowback/params.cpp, the devnet's set_create)
    seats: 15
    bondMin: 10               # YEC
    bondLockMin: 200          # blocks
    livenessWindow: 1000      # blocks
    # The set's maturity (its bond exit delay). "" = the YED module's BOND_MATURITY for the network
    # (regtest 8, mainnet/testnet 16,128), the only value it adopts; the post-quantum line's
    # set_create refuses less than 2 on regtest and 16,128 on mainnet/testnet (D-Q-31), so the
    # render fails on either mistake (templates/_helpers.tpl yc.attestorSetMaturity).
    maturity: ""
  # The faucet (images/faucet, templates/kind/faucet.yaml): fund-helper's logic as a Deployment
  # behind the gateway at /faucet/ (the page, /send, /mine, /address, the Sapling proving files at
  # /faucet/params/ from a PVC filled once). REGTEST ONLY — it spends the node's wallet.
  faucet:
    enabled: false
    rateSeconds: 5            # one acting request (send/mine/reorg) per this many seconds, all callers
    params: { size: 100Mi, storageClassName: "", url: "https://download.z.cash/downloads/" }

# ---- observability -----------------------------------------------------------------------------
monitoring:
  serviceMonitor: false       # kube-prometheus-stack CRDs present: scrape lightwalletd (gRPC + cache), yindex (tip/lag), the faucet (node probe)
  dashboards: false           # the provisioned Grafana dashboard (templates/observability/dashboard.yaml) as a ConfigMap the Grafana sidecar picks up
  grafana:
    route: false              # kind demo: HTTPRoute /grafana/ on the gateway → the kube-prometheus-stack Grafana (plus the ReferenceGrant in its namespace)
    namespace: monitoring
    service: kube-prometheus-stack-grafana
    port: 80
