{{- if and .Values.externalSecrets .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: {{ .Values.ycashd.rpc.existingSecret }} }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.externalSecrets.storeRef }} }
  target: { name: {{ .Values.ycashd.rpc.existingSecret }} }
  data:
    - { secretKey: rpcuser,     remoteRef: { key: {{ .Values.externalSecrets.ycashdRpc }}, property: rpcuser } }
    - { secretKey: rpcpassword, remoteRef: { key: {{ .Values.externalSecrets.ycashdRpc }}, property: rpcpassword } }
{{- if and .Values.yindex.enabled (not .Values.yindex.postgres.enabled) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: {{ .Values.yindex.postgres.existingSecret }} }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.externalSecrets.storeRef }} }
  target: { name: {{ .Values.yindex.postgres.existingSecret }} }
  data:
    - { secretKey: url, remoteRef: { key: {{ .Values.externalSecrets.yindexPostgres }}, property: url } }
{{- end }}
{{- end }}
