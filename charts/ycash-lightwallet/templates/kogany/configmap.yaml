{{- if include "yc.kogany" . }}
{{- $heights := .Values.kogany.activationHeights }}
{{- if not $heights.Vault }}
{{- fail "nodeLine kogany: kogany.activationHeights needs Overwinter..Canopy and Vault, equal to ycashd's -nuparams (values-kind-kogany.yaml)" }}
{{- end }}
# zakurad.toml for the kogany node (workspace kogany plan W9-c): Ycash regtest, the legacy P2P stack
# only (kogany plan K-11), no RPC authentication (ClusterIP only), the state on the PVC. The YED
# attestor set the arming Job records is added at start (statefulset.yaml), as ycashd's
# -yellowbackattestorset.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yc.fullname" . }}-kogany
  labels: {{- include "yc.labels" . | nindent 4 }}
    app.kubernetes.io/component: kogany
data:
  zakurad.toml: |
    [network]
    listen_addr = "0.0.0.0:{{ .Values.kogany.p2p.port }}"
    initial_testnet_peers = []
    p2p_stack = "legacy"
    cache_dir = "/var/lib/zakura/network"
    identity_dir = "/var/lib/zakura/identity"

    [network.network]
    regtest = true

    [network.network.params.activation_heights]
    {{- range $nu := list "Overwinter" "Sapling" "Ycash" "Blossom" "Heartwood" "Canopy" "Vault" }}
    {{- with index $heights $nu }}
    {{ $nu }} = {{ int . }}
    {{- end }}
    {{- end }}

    [rpc]
    listen_addr = "0.0.0.0:{{ .Values.kogany.rpc.port }}"
    enable_cookie_auth = false
    cookie_dir = "/tmp/rpc"

    [state]
    cache_dir = "/var/lib/zakura/state"
    ephemeral = false

    [mempool]
    debug_enable_at_height = 0

    [mining]
    internal_miner = false

    [tracing]
    use_color = false
    filter = {{ .Values.kogany.logFilter | quote }}
{{- end }}
