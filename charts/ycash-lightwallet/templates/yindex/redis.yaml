{{- if .Values.redis.enabled }}
{{- $fn := include "yc.fullname" . }}
# The tip-hash-keyed cache (plan K3): yindex answers GetTaddressBalance from it and, once the
# lightwalletd-side cache lands, yed_* reads are remembered here per (method, args, tip hash).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "yc.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis }
  template:
    metadata:
      labels: {{- include "yc.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      {{- /* redis:*-alpine's own redis user (uid 999); --save "" keeps nothing, /data is its working directory */}}
      {{- include "yc.podSecurity" (list . 999) | nindent 6 }}
      volumes: [{ name: data, emptyDir: {} }]
      containers:
        - name: redis
          image: {{ include "yc.image" .Values.images.redis }}
          imagePullPolicy: {{ .Values.images.redis.pullPolicy }}
          {{- include "yc.containerSecurity" . | nindent 10 }}
          args: ["--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports: [{ name: redis, containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 30, failureThreshold: 5 }
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $fn }}-redis }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis }
  ports: [{ name: redis, port: 6379 }]
{{- end }}
