{{- if not .Values.ycashd.rpc.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yc.fullname" . }}-ycashd-rpc
  labels: {{- include "yc.labels" . | nindent 4 }}
type: Opaque
stringData:
  rpcuser: {{ .Values.ycashd.rpc.user | quote }}
  rpcpassword: {{ required "ycashd.rpc.password (or ycashd.rpc.existingSecret) is required" .Values.ycashd.rpc.password | quote }}
{{- end }}
