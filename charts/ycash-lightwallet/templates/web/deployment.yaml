{{- if .Values.web.enabled }}
{{- $fn := include "yc.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-web
  labels: {{- include "yc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: {{- include "yc.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      {{- /* images/web runs as nginx (uid 101, USER in its Dockerfile); the entrypoint renders the
             template into conf.d, nginx writes its temp files to /var/cache/nginx and its pid to /tmp */}}
      {{- include "yc.podSecurity" (list . 101) | nindent 6 }}
      volumes:
        - { name: conf, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
      containers:
        - name: web
          image: {{ include "yc.image" .Values.images.web }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          {{- include "yc.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
          ports: [{ name: http, containerPort: 8080 }]
          {{- with .Values.web.env }}
          env:
            {{- range $k, $v := . }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- end }}
          readinessProbe: { httpGet: { path: /, port: http } }
          livenessProbe: { tcpSocket: { port: http }, periodSeconds: 30 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $fn }}-web }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 8080 }]
{{- end }}
