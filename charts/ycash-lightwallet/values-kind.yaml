# One laptop: regtest, the vault upgrade active from height 1, the miner in-cluster, NodePorts
# mapped by kind/kind.yaml, a self-signed certificate.
ycashd:
  replicas: 1
  network: regtest
  # The seven upgrades at height 1, exactly as the node test framework and the devnet start a
  # regtest (ycash6 qa/rpc-tests/test_framework/yellowback_util.py YCASH_UPGRADE_ARGS + util.py):
  # Overwinter, Sapling, Ycash, Blossom, Heartwood, Canopy (Ycash's own branch ids), then Vault.
  # The light clients' regtest parameters assume Canopy from height 1: a chain without it writes
  # pre-Canopy notes the wallet cannot decrypt (W0.5), and without Sapling it has no tree state.
  extraArgs: "-nuparams=5ba81b19:1 -nuparams=76b809bb:1 -nuparams=374d694f:1 -nuparams=8e471bd6:1 -nuparams=66314da3:1 -nuparams=19bd2d2f:1 -nuparams=6d5b7a31:1"
  rpc: { port: 18832, user: ycash, password: ycash-regtest, threads: 8, workqueue: 32 }
  p2p: { listen: false, port: 18833 }
  storage: { size: 5Gi }
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 3Gi } }
  podDisruptionBudget: { enabled: false }
lightwalletd:
  replicas: 2
  cache: { sizeLimit: 512Mi }
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 1Gi } }
  autoscaling: { enabled: true, min: 2, max: 4, cpuUtilization: 70 }
  podDisruptionBudget: { enabled: false }
yindex:
  replicas: 1
  postgres: { storage: { size: 2Gi }, resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } } }
redis:
  maxmemory: 128mb
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 192Mi } }
web:
  enabled: true               # `make image-web YEW=…` + `make kind-load` first (K4)
  replicas: 1
  # The yew/web kind smoke (`scripts/test-web-smoke.sh --kind https://localhost/`) fetches the
  # proving files from its loopback helper instead of download.z.cash: let the CSP allow it.
  env: { CSP_CONNECT_SRC_EXTRA: "http://127.0.0.1:8766" }
gateway:
  host: localhost
  tls: { mode: certmanager, issuer: "" }
  plaintextGrpc: true
  plaintextGrpcCors: true     # the yew/web browser tests and the Vite dev server call localhost:9067 cross-origin
  service: { type: NodePort }
  rateLimit: { enabled: true, perIpPerSecond: 500, sendPerIpPerMinute: 600 }
regtest:
  enabled: true
  activationHeight: 1
  bootstrapBlocks: 200
  minerIntervalSeconds: 5
  armYellowback: true         # the YED attestor set + the node restart + the lightwalletd roll (K0b)
monitoring: { serviceMonitor: false }
