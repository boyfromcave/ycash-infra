{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "externalSecrets.enabled needs rpc.existingSecret (the Secret it writes)" .Values.rpc.existingSecret }}
  labels: {{- include "yt.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ required "externalSecrets.storeRef" .Values.externalSecrets.storeRef }} }
  target: { name: {{ .Values.rpc.existingSecret }} }
  data:
    - { secretKey: rpcuser,     remoteRef: { key: {{ required "externalSecrets.ycashdRpc" .Values.externalSecrets.ycashdRpc }}, property: rpcuser } }
    - { secretKey: rpcpassword, remoteRef: { key: {{ .Values.externalSecrets.ycashdRpc }}, property: rpcpassword } }
{{- end }}
{{- if and .Values.externalSecrets.enabled .Values.faucet.enabled .Values.faucet.wallet.remoteKey }}
{{- include "yt.keys" (dict "root" . "what" "the faucet wallet's ExternalSecret") }}
---
# The faucet wallet's recovery phrase (T-9: testnet only, from the secret store, never in git or in
# Terraform state); the wallet node mounts the Secret this writes as a file (-mnemonicfile).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.faucet.wallet.existingSecret }}
  labels: {{- include "yt.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ required "externalSecrets.storeRef" .Values.externalSecrets.storeRef }} }
  target: { name: {{ .Values.faucet.wallet.existingSecret }} }
  data:
    - { secretKey: {{ .Values.faucet.wallet.secretKey }}, remoteRef: { key: {{ .Values.faucet.wallet.remoteKey }}, property: mnemonic } }
{{- end }}
{{- $gh := .Values.snapshotter.publish.github }}
{{- if and .Values.externalSecrets.enabled .Values.snapshotter.enabled $gh.enabled $gh.remoteKey }}
{{- include "yt.keys" (dict "root" . "what" "the snapshotter's GitHub token") }}
---
# The snapshotter's GitHub token (contents: write on the publishing repository only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $gh.existingSecret }}
  labels: {{- include "yt.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ required "externalSecrets.storeRef" .Values.externalSecrets.storeRef }} }
  target: { name: {{ $gh.existingSecret }} }
  data:
    - { secretKey: {{ $gh.secretKey }}, remoteRef: { key: {{ $gh.remoteKey }}, property: token } }
{{- end }}
