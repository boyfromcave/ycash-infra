{{- if .Values.networkPolicy.enabled }}
{{- $_ := include "yt.network" . }}
# The node pods: P2P from anywhere (they are the network's seeds), RPC only from this release's own
# pods and networkPolicy.rpcFrom. The probes run ycash-cli inside the container (loopback), which a
# NetworkPolicy does not see. Egress stays open: P2P to any peer, DNS, HTTPS for the prefix restore
# and (ycash-dd) the parameter files (zcashParams.url, GitHub releases by default).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "yt.fullname" . }}-nodes
  labels: {{- include "yt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      ycash.org/node: "true"
  policyTypes: [Ingress]
  ingress:
    - ports: [{ protocol: TCP, port: {{ .Values.p2p.port }} }]
    - ports: [{ protocol: TCP, port: {{ .Values.rpc.port }} }]
      from:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
        {{- with .Values.networkPolicy.rpcFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
