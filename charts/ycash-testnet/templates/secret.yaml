{{- if not .Values.rpc.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yt.fullname" . }}-rpc
  labels: {{- include "yt.labels" . | nindent 4 }}
type: Opaque
stringData:
  rpcuser: {{ .Values.rpc.user | quote }}
  rpcpassword: {{ required "rpc.password (or rpc.existingSecret) is required" .Values.rpc.password | quote }}
{{- end }}
