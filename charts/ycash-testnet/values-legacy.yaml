# testnet-legacy (workspace docs/plans/yellowback-testnet-plan.md, Revision 3): one release per network,
# layered over values-kind.yaml or values-eks.yaml, e.g.
#   helm upgrade --install legacy charts/ycash-testnet -n legacy -f charts/ycash-testnet/values-eks.yaml -f charts/ycash-testnet/values-legacy.yaml
# What differs between the three testnets is only this: the profile, its ports and its magic. On the
# testnet cluster the seeds run on EC2 (infra/testnet-seeds, on the same ports): the deployment sets
# seed.enabled=false and peers.addnode to them.
testnetProfile: legacy
rpc: { port: 19032 }
p2p: { port: 19033 }
prefixRestore:
  # mainnet-prefix-v1 (Ycash mainnet 0..3,079,999 = H_S, ycash-prefix/1): manifest.json, SHA256SUMS,
  # SHA256SUMS.minisig, treestate.json and 308 .blocks.gz chunks (~18.7 GB), flat under baseUrl
  enabled: true
  baseUrl: https://ycash-contributors-object-store.s3.amazonaws.com/snapshots/prefix/mainnet-prefix-v1
  sha256sums: 456e820511ade7d9ffd8db41b168ee6063050bb05e2af6a651072bbfb74eecd3   # sha256 of that SHA256SUMS
  network: ycash-mainnet
  lastHeight: 3079999
  magic: f77962d5                # the prefix is shared (magic-neutral); framed with this network's magic
seed:
  p2pService: { nodePortBase: 32033 }   # kind (NodePort) only: 32033.. per seed, so the three releases fit one kind cluster
  storage: { size: 120Gi }              # mainnet-prefix-v1: 18.7 GB chunks + 23.1 GB framed copies + the imported chain
verifierDd:
  storage: { size: 120Gi }
externalSecrets:
  ycashdRpc: ycash/testnet/legacy/ycashd-rpc   # infra/eks/module, networks = [..., "legacy"]: {rpcuser, rpcpassword}
# The services (plan §6.2, T-19), off on EKS until the deployment turns them on (README "The services"):
# the hosts are placeholders (T-3); the lightwallet release's gateway needs listeners for them
# (charts/ycash-lightwallet gateway.extraListeners, faucet and status).
faucet:
  wallet: { remoteKey: ycash/testnet/legacy/faucet-wallet }   # {mnemonic}, created by hand in the secret store (never by Terraform)
  route: { host: faucet-legacy.example.org }
status:
  route: { host: status-legacy.example.org }
